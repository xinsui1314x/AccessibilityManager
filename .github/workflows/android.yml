name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新版 cmdline-tools 的 sdkmanager 要 JDK 17；先用 17 跑 SDK 工具
      - name: Set up JDK 17 (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inspect preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Accept licenses and ensure SDK 33
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"

      # 切回 JDK 11：AGP 7.4.1 / Gradle 7.5 只能跑在 11
      - name: Set up JDK 11 (for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage artifacts and fingerprint
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/
          echo "commit=$(git rev-parse HEAD)" | tee out/BUILD_INFO.txt
          sha256sum out/app-debug.apk | tee out/apk.sha256.txt
          ls -l out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: accessibilitymanager-debug
          path: out/
          retention-days: 30
