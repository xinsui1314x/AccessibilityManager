name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept licenses and install SDK 33
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage artifacts and fingerprint
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/
          echo "commit=$(git rev-parse HEAD)" | tee out/BUILD_INFO.txt
          sha256sum out/app-debug.apk | tee out/apk.sha256.txt
          ls -l out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: accessibilitymanager-debug
          path: out/
          retention-days: 30
